name: Native Python publication validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned native venv (no Docker)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
          .venv/bin/python -m pip check
      - name: Check Python and Bash launchers
        run: |
          .venv/bin/python -m ruff check scripts/run_publication_final.py
          .venv/bin/python -m compileall -q scripts/run_publication_final.py
          bash -n scripts/run_publication_final.sh
          python scripts/run_publication_final.py --help
      - name: Test custom Python interpreter selection
        run: .venv/bin/python -m pytest -q tests/test_publication_runner_interpreter.py
      - name: Test moving-target theorem and extended benchmarks
        run: .venv/bin/python -m pytest -q tests/test_extended_tracking_publication.py
      - name: Test total-cost frontier and heldout readout accounting
        run: |
          .venv/bin/python -m pytest -q tests/test_total_cost_phase_diagram.py
          .venv/bin/python -m qcenn_mi.total_cost_phase_diagram \
            --smoke --horizon 4 --query-budget 32 --shots-per-setting 1 \
            --output-dir artifacts/total-cost-smoke
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("artifacts/total-cost-smoke")
          manifest = json.loads((root / "MANIFEST.json").read_text())["sha256"]
          for name, digest in manifest.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          report = json.loads((root / "result.json").read_text())
          assert report["settings"] == 8
          assert sum(report["region_counts"].values()) == 8
          assert report["training_and_heldout_seeds_disjoint"]
          print("Heldout cost frontier and SHA-256 integrity PASS.")
          PY
      - name: Execute pinned native Python smoke end-to-end
        run: |
          python scripts/run_publication_final.py \
            --profile smoke --venv .venv --skip-install \
            --output-dir artifacts/native-python-ci
      - name: Resume partial smoke without historical static data or rerunning full suite
        run: |
          mv artifacts/native-python-ci/FINAL_EVIDENCE.tar.gz artifacts/native-python-ci/prior-final.tar.gz
          mv artifacts/native-python-ci/comparison artifacts/native-python-ci/prior-comparison
          mv results/polynomial-access-validation/polynomial-summary.json "$RUNNER_TEMP/polynomial-summary.json"
          trap 'mv "$RUNNER_TEMP/polynomial-summary.json" results/polynomial-access-validation/polynomial-summary.json' EXIT
          before=$(sha256sum artifacts/native-python-ci/suite/validation.json | cut -d' ' -f1)
          .venv/bin/python scripts/run_publication_final.py \
            --profile smoke --venv .venv --skip-install --resume \
            --total-cost-study --total-cost-condition 2 \
            --total-cost-query-budget 32 --total-cost-shots-per-setting 1 \
            --output-dir artifacts/native-python-ci
          after=$(sha256sum artifacts/native-python-ci/suite/validation.json | cut -d' ' -f1)
          test "$before" = "$after"
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/native-python-ci")
          status = json.loads((root / "comparison/comparison.json").read_text())
          assert status["previous_static"]["status"] == "not_available"
          assert status["paper_table"]["status"] == "passed"
          assert status["matched_study_verified"]
          assert (root / "FINAL_EVIDENCE.tar.gz").is_file()
          assert json.loads((root / "RUN.json").read_text())["resume"]
          assert (root / "total-cost" / "MANIFEST.json").is_file()
          assert (root / "total-cost.zip").is_file()
          final = json.loads((root / "FINAL_SHA256SUMS.json").read_text())
          assert "total-cost/result.json" in final["files_sha256"]
          print("Crash recovery without static history or re-running science: PASS")
          PY
      - name: Verify native evidence package and source identity
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess
          root = Path("artifacts/native-python-ci")
          pin = json.loads((root / "FINAL_SHA256SUMS.json").read_text())
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert pin["source_commit"] == sha
          assert (root / "FINAL_EVIDENCE.tar.gz").is_file()
          assert pin["execution"] == "native-python-no-docker"
          for path, expected in pin["files_sha256"].items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == expected
          status = json.loads((root / "suite" / "validation.json").read_text())
          assert status["passed"] and status["profile"] == "smoke"
          assert status["provenance"]["execution_context"] == "native-python"
          print("Native Python publication smoke and SHA-256 audit passed.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-python-publication-${{ github.sha }}
          path: |
            artifacts/native-python-ci/RUN.json
            artifacts/native-python-ci/FINAL_SHA256SUMS.json
            artifacts/native-python-ci/FINAL_EVIDENCE.tar.gz
            artifacts/native-python-ci/comparison/
            artifacts/native-python-ci/phase-bias/
            artifacts/native-python-ci/temporal-full/
            artifacts/native-python-ci/submission-preflight.json
            artifacts/native-python-ci/suite-run.log
          if-no-files-found: warn
          retention-days: 30

  python314-custom-venv:
    name: Python 3.14 custom .venv-qcenn interpreter
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install using the user's custom virtualenv name
        run: |
          python -m venv .venv-qcenn
          .venv-qcenn/bin/python -m pip install -e '.[dev,analysis]'
          .venv-qcenn/bin/python -m pip check
      - name: Test interpreter reuse without Python 3.12 lock enforcement
        run: |
          .venv-qcenn/bin/python -m pytest -q tests/test_publication_runner_interpreter.py
          .venv-qcenn/bin/python -u scripts/run_publication_final.py \
            --profile smoke --skip-install \
            --output-dir artifacts/python314-native-ci
      - name: Assert correct interpreter and compatibility provenance
        run: |
          .venv-qcenn/bin/python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/python314-native-ci/RUN.json").read_text())
          assert p["python_version"] == "3.14"
          assert ".venv-qcenn/bin/python" in p["python"]
          assert p["dependency_mode"] == "compatible-unpinned-python"
          assert Path("artifacts/python314-native-ci/FINAL_EVIDENCE.tar.gz").is_file()
          print("Custom Python 3.14 environment reused successfully.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-python314-custom-venv-${{ github.sha }}
          path: |
            artifacts/python314-native-ci/RUN.json
            artifacts/python314-native-ci/comparison/
            artifacts/python314-native-ci/submission-preflight.json
            artifacts/python314-native-ci/suite-run.log
          if-no-files-found: warn
          retention-days: 30
