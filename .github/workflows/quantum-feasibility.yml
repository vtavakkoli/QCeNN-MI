name: Quantum feasibility proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  assumption-a1:
    name: Assumption A1 / Qiskit proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static quality checks
        run: |
          python -m compileall -q src tests
          ruff check src tests

      - name: Run unit tests
        run: pytest -q

      - name: Run quantum A1 benchmark
        run: |
          qcenn-mi \
            --matrix 2.0 0.5 0.5 1.5 \
            --shots 8192 \
            --seed 42 \
            --output-dir results/assumption-a1

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          if [ -f results/assumption-a1/summary.md ]; then
            cat results/assumption-a1/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quantum result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcenn-mi-assumption-a1-${{ github.sha }}
          path: results/assumption-a1/
          if-no-files-found: warn
          retention-days: 30

      - name: Run A2-A4 simulator campaign
        run: python -m qcenn_mi.experiments --output-dir results/a2-a4

      - name: Publish A2-A4 summary
        if: always()
        run: |
          if [ -f results/a2-a4/summary.md ]; then
            cat results/a2-a4/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload A2-A4 simulator results and circuit exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcenn-mi-a2-a4-${{ github.sha }}
          path: results/a2-a4/
          retention-days: 30

      - name: Run larger matrix and dynamic simulator checks
        run: python -m qcenn_mi.scaling --output-dir results/scaling

      - name: Publish scaling summary
        if: always()
        run: |
          if [ -f results/scaling/summary.md ]; then
            cat results/scaling/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scaling and dynamic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcenn-mi-scaling-${{ github.sha }}
          path: results/scaling/
          retention-days: 30

      - name: Run standalone coherent inverse-action benchmark
        run: python -m qcenn_mi.coherent_benchmark --output-dir results/coherent

      - name: Publish coherent inverse-action summary
        if: always()
        run: |
          if [ -f results/coherent/summary.md ]; then
            cat results/coherent/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coherent results, circuits and raw-count audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcenn-mi-coherent-${{ github.sha }}
          path: results/coherent/
          retention-days: 30

      - name: Run 10x10, 100x100 and 1000x1000 coherent size study
        run: python -m qcenn_mi.coherent_large_benchmark --output-dir results/coherent-large

      - name: Publish coherent size-study summary
        if: always()
        run: |
          if [ -f results/coherent-large/summary.md ]; then
            cat results/coherent-large/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coherent size-study evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcenn-mi-coherent-large-${{ github.sha }}
          path: results/coherent-large/
          retention-days: 30
